<text x="90" y="1157.0" font-family="Arial" font-size="17" fill="#19344d" text-anchor="start" font-weight="normal" text-decoration="none">Small squares are ports. Plain lines are connectors, not execution order. Service connectors match required/provided contracts.</text>
<text x="90" y="1179.95" font-family="Arial" font-size="17" fill="#19344d" text-anchor="start" font-weight="normal" text-decoration="none">Part labels are not underlined: they denote typed roles with multiplicity, not the concrete objects shown in G-05A.</text>
<text x="40" y="1278.0" font-family="Arial" font-size="18" fill="#19344d" text-anchor="start" font-weight="normal" text-decoration="none">Scope: supplier assessment collaboration inside TripMate AI. Operations and the human are outside this context, not outside all software.</text>
<text x="40" y="1302.3" font-family="Arial" font-size="18" fill="#19344d" text-anchor="start" font-weight="normal" text-decoration="none">SupplierAssessmentContext and the shown ports are a runtime design refinement; they do not add new business-domain classes.</text>
<text x="40" y="1326.6" font-family="Arial" font-size="18" fill="#19344d" text-anchor="start" font-weight="normal" text-decoration="none">Persistence uses the existing AgentRun / TraceEntry records and local application storage; repositories and an approval queue are not</text>
<text x="40" y="1350.9" font-family="Arial" font-size="18" fill="#19344d" text-anchor="start" font-weight="normal" text-decoration="none">expanded into additional services here. Waiting for a human is a stored status, not a new message broker.</text>
<text x="40" y="1375.2" font-family="Arial" font-size="18" fill="#19344d" text-anchor="start" font-weight="normal" text-decoration="none">The full group runtime model must integrate planning, exception handling and the shared UI/storage around this contribution.</text>
</svg>