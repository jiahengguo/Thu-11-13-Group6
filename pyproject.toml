[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tripmate-ai"
version = "0.1.0"
description = "TripMate AI modular prototype and shared agent contracts"
requires-python = ">=3.9"
dependencies = ["jsonschema[format]>=4.23,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tripmate.contracts" = ["v1/*.json"]

"tripmate.api" = ["static/*.html", "static/*.css", "static/*.js"]
"tripmate.fixtures" = ["*.json"]
